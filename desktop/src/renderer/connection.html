<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Connection</title><link rel="stylesheet" href="connection.css"><script src="connection.js" defer></script></head><body>
<header><h1>Connection</h1><button id="close" type="button" aria-label="Close connection settings">×</button></header>
<p class="detail">Gemini · saved keys stay encrypted on this Mac. Conversation lasts for this run; sent messages go to Google.</p>
<label id="key-label" for="api-key">API key</label><div class="key-row"><input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your Gemini key"><button id="connect" type="button">Save key</button></div>
<p id="connection-status" role="status">Not connected yet.</p><p id="error" role="alert" hidden></p>
<p id="last-failure" role="status" hidden></p><button id="remove" type="button" disabled>Remove saved key</button>
<div class="footer"><button id="key-help" type="button">Get a key ↗</button><button id="clear" type="button">Forget this conversation</button></div>
</body></html>
