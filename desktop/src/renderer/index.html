<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Nest Pet — Desktop Shell</title>
  <link rel="stylesheet" href="style.css">
  <script src="gaze.js" defer></script>
  <script src="pet.js" defer></script>
</head>
<body>
  <main aria-label="Desktop pet">
    <div id="pet-wrap">
      <button id="pet" type="button" aria-label="Pet your companion. Drag to move; right-click for controls.">
        <video id="character-video" muted loop playsinline preload="auto" aria-hidden="true"></video>
        <canvas id="attention-frame" width="640" height="360" aria-hidden="true"></canvas>
      </button>
    </div>
  </main>
  <video id="attention-source" muted playsinline preload="auto" src="assets/dafeiyu/idle.webm" aria-hidden="true"></video>
</body>
</html>
